apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis-orphan
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/armosec/armo-platform-tools.git"
    targetRevision: main
    path: demo-cluster/environments/armo-platform-cluster/adopted/redis-orphan
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
---
