# --- Deployment/frontend ---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    internal.kpt.dev/upstream-identifier: apps|Deployment|frontend|frontend
  name: frontend
  namespace: frontend
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: frontend
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        sidecar.istio.io/rewriteAppHTTPProbers: 'true'
      labels:
        app: frontend
    spec:
      containers:
      - env:
        - name: PORT
          value: '8080'
        - name: PRODUCT_CATALOG_SERVICE_ADDR
          value: productcatalogservice.product-catalog.svc.cluster.local:3550
        - name: CURRENCY_SERVICE_ADDR
          value: currencyservice.currency.svc.cluster.local:7000
        - name: CART_SERVICE_ADDR
          value: cartservice.cart.svc.cluster.local:7070
        - name: RECOMMENDATION_SERVICE_ADDR
          value: recommendationservice.recommendation.svc.cluster.local:8080
        - name: SHIPPING_SERVICE_ADDR
          value: shippingservice.shipping.svc.cluster.local:50051
        - name: CHECKOUT_SERVICE_ADDR
          value: checkoutservice.checkout.svc.cluster.local:5050
        - name: AD_SERVICE_ADDR
          value: adservice.ad.svc.cluster.local:9555
        - name: ENABLE_PROFILER
          value: '0'
        image: gcr.io/google-samples/microservices-demo/frontend:v0.9.0
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            httpHeaders:
            - name: Cookie
              value: shop_session-id=x-liveness-probe
            path: /_healthz
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        name: server
        ports:
        - containerPort: 8080
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            httpHeaders:
            - name: Cookie
              value: shop_session-id=x-readiness-probe
            path: /_healthz
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 100m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: true
          privileged: true
          seccompProfile:
            localhostProfile: frontend/Deployment-frontend-server.json
            type: Localhost
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /etc/secret-data
          name: my-secret-vol
          readOnly: true
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      serviceAccount: armo-frontend-sa
      serviceAccountName: armo-frontend-sa
      terminationGracePeriodSeconds: 30
      volumes:
      - name: my-secret-vol
        secret:
          defaultMode: 420
          secretName: my-secret
---
# --- Service/frontend ---
apiVersion: v1
kind: Service
metadata:
  annotations:
    cloud.google.com/neg: '{"ingress":true}'
    internal.kpt.dev/upstream-identifier: '|Service|frontend|frontend'
  name: frontend
  namespace: frontend
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 8080
  selector:
    app: frontend
  sessionAffinity: None
  type: ClusterIP
---
# --- Service/frontend-external ---
apiVersion: v1
kind: Service
metadata:
  annotations:
    cloud.google.com/neg: '{"ingress":true}'
    internal.kpt.dev/upstream-identifier: '|Service|frontend|frontend-external'
    networking.gke.io/target-pool: aa8ef9e85ddcc4f2286e6e49bebb6a3a
  name: frontend-external
  namespace: frontend
spec:
  allocateLoadBalancerNodePorts: true
  externalTrafficPolicy: Cluster
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: http
    nodePort: 31463
    port: 80
    protocol: TCP
    targetPort: 8080
  selector:
    app: frontend
  sessionAffinity: None
  type: LoadBalancer
---
# --- NetworkPolicy/deployment-frontend ---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  annotations:
    generated-by: kubescape
    kubescape-action-guid: 3780220a-2944-414c-ad7d-0ebf350095f0
  labels:
    kubescape.io/workload-api-group: apps
    kubescape.io/workload-api-version: v1
    kubescape.io/workload-kind: Deployment
    kubescape.io/workload-name: frontend
    kubescape.io/workload-namespace: frontend
  name: deployment-frontend
  namespace: frontend
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
  - Ingress
