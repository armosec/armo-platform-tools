# --- Deployment/nginx-static ---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
  labels:
    app: nginx-static
  name: nginx-static
  namespace: static-serving
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: nginx-static
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
      labels:
        app: nginx-static
    spec:
      containers:
      - image: nginx:latest
        imagePullPolicy: Always
        name: nginx
        ports:
        - containerPort: 80
          protocol: TCP
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /usr/share/nginx/html
          name: web-content
        - mountPath: /etc/nginx/nginx.conf
          name: nginx-config-volume
          subPath: nginx.conf
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 420
          name: nginx-static-content
        name: web-content
      - configMap:
          defaultMode: 420
          name: nginx-static-config
        name: nginx-config-volume
---
# --- Service/nginx-static-service ---
apiVersion: v1
kind: Service
metadata:
  annotations:
    cloud.google.com/neg: '{"ingress":true}'
  name: nginx-static-service
  namespace: static-serving
spec:
  externalTrafficPolicy: Cluster
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - nodePort: 32150
    port: 80
    protocol: TCP
    targetPort: 80
  selector:
    app: nginx-static
  sessionAffinity: None
  type: NodePort
---
# --- ConfigMap/nginx-static-config ---
apiVersion: v1
data:
  nginx.conf: "user  nginx;\nworker_processes  1;\n\nerror_log  /tmp/error.log warn;\n\
    pid        /var/run/nginx.pid;\n\nevents {\n    worker_connections  1024;\n}\n\
    \nhttp {\n    include       /etc/nginx/mime.types;\n    default_type  application/octet-stream;\n\
    \n    log_format  main  '$remote_addr - $remote_user [$time_local] \"$request\"\
    \ '\n                      '$status $body_bytes_sent \"$http_referer\" '\n   \
    \                   '\"$http_user_agent\" \"$http_x_forwarded_for\"';\n\n    access_log\
    \  /tmp/access.log  main;\n\n    sendfile        on;\n    #tcp_nopush     on;\n\
    \n    keepalive_timeout  65;\n\n    #gzip  on;\n\n    include /etc/nginx/conf.d/*.conf;\n\
    }\n"
kind: ConfigMap
metadata:
  name: nginx-static-config
  namespace: static-serving
---
# --- ConfigMap/nginx-static-content ---
apiVersion: v1
data:
  index.html: '<!DOCTYPE html>

    <html>

    <head>

    <title>Welcome to NGINX!</title>

    </head>

    <body>

    <h1>Hello, Kubernetes!</h1>

    <p>This is a static web page served from an NGINX container!</p>

    </body>

    </html>

    '
kind: ConfigMap
metadata:
  name: nginx-static-content
  namespace: static-serving