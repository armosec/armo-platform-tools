# --- Deployment/payments-api ---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
  labels:
    app: payments-api
  name: payments-api
  namespace: credit-finance
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: payments-api
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
      labels:
        app: payments-api
    spec:
      containers:
      - args:
        - -text=Payments API
        image: hashicorp/http-echo
        imagePullPolicy: Always
        name: api
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
---
# --- Service/payments-api ---
apiVersion: v1
kind: Service
metadata:
  annotations:
    cloud.google.com/neg: '{"ingress":true}'
  name: payments-api
  namespace: credit-finance
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - port: 80
    protocol: TCP
    targetPort: 5678
  selector:
    app: payments-api
  sessionAffinity: None
  type: ClusterIP