# --- Deployment/hunger-check-deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
  name: hunger-check-deployment
  namespace: big-monolith
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: hunger-check
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
      labels:
        app: hunger-check
    spec:
      containers:
      - image: madhuakula/k8s-goat-hunger-check
        imagePullPolicy: Always
        name: hunger-check
        ports:
        - containerPort: 8080
          protocol: TCP
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: big-monolith-sa
      serviceAccountName: big-monolith-sa
      terminationGracePeriodSeconds: 30
---
# --- Service/hunger-check-service ---
apiVersion: v1
kind: Service
metadata:
  annotations:
    cloud.google.com/neg: '{"ingress":true}'
  name: hunger-check-service
  namespace: big-monolith
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - port: 8080
    protocol: TCP
    targetPort: 8080
  selector:
    app: hunger-check
  sessionAffinity: None
  type: ClusterIP
---
# --- ServiceAccount/big-monolith-sa ---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: big-monolith-sa
  namespace: big-monolith