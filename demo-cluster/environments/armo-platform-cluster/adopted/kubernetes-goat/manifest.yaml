# --- Job/armo-ebpf-check ---
apiVersion: batch/v1
kind: Job
metadata:
  labels:
    batch.kubernetes.io/controller-uid: ca46adc9-d566-4573-a772-c5a9a84aa14e
    batch.kubernetes.io/job-name: armo-ebpf-check
    controller-uid: ca46adc9-d566-4573-a772-c5a9a84aa14e
    job-name: armo-ebpf-check
  name: armo-ebpf-check
  namespace: default
spec:
  backoffLimit: 6
  completionMode: NonIndexed
  completions: 1
  manualSelector: false
  parallelism: 1
  podReplacementPolicy: TerminatingOrFailed
  selector:
    matchLabels:
      batch.kubernetes.io/controller-uid: ca46adc9-d566-4573-a772-c5a9a84aa14e
  suspend: false
  template:
    metadata:
      labels:
        batch.kubernetes.io/controller-uid: ca46adc9-d566-4573-a772-c5a9a84aa14e
        batch.kubernetes.io/job-name: armo-ebpf-check
        controller-uid: ca46adc9-d566-4573-a772-c5a9a84aa14e
        job-name: armo-ebpf-check
    spec:
      containers:
      - args:
        - "if [ ! -r /sys/fs/bpf ]; then\n  echo \"eBPF is not supported on $(hostname)\"\n  exit 1\nelse\n  echo \"eBPF is supported on $(hostname)\"\nfi\n"
        command:
        - /bin/sh
        - -c
        image: busybox
        imagePullPolicy: Always
        name: armo-ebpf-check
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Never
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
