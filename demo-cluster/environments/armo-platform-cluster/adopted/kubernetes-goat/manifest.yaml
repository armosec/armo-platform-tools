# --- Deployment/bad-creds-deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
  name: bad-creds-deployment
  namespace: default
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: bad-creds
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
      labels:
        app: bad-creds
    spec:
      containers:
      - env:
        - name: BAD_SECRET
          value: private_secret
        image: madhuakula/k8s-goat-health-check
        imagePullPolicy: Always
        name: bad-creds
        ports:
        - containerPort: 80
          protocol: TCP
        resources:
          limits:
            cpu: 30m
            memory: 100Mi
        securityContext:
          privileged: true
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /custom/docker/docker.sock
          name: docker-sock-volume
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - hostPath:
          path: /var/run/docker.sock
          type: Socket
        name: docker-sock-volume
---
