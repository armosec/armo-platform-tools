# --- Deployment/supplychain-attack ---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
  labels:
    app: supplychain-attack
  name: supplychain-attack
  namespace: default
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: supplychain-attack
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
      labels:
        app: supplychain-attack
    spec:
      containers:
      - args:
        - sleep 30; while true; do wget sodiumlaurethsulfatedesyroyer.com; sleep 2; done
        command:
        - /bin/sh
        - -c
        - --
        image: alpine:latest
        imagePullPolicy: IfNotPresent
        name: alpine
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          runAsUser: 0
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /data
          name: supplychain-attack-data
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - emptyDir: {}
        name: supplychain-attack-data
---
# --- Deployment/system-monitor-deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
  name: system-monitor-deployment
  namespace: default
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: system-monitor
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
      labels:
        app: system-monitor
    spec:
      containers:
      - env:
        - name: K8S_GOAT_VAULT_KEY
          valueFrom:
            secretKeyRef:
              key: k8sgoatvaultkey
              name: goatvault
        image: madhuakula/k8s-goat-system-monitor
        imagePullPolicy: Always
        name: system-monitor
        ports:
        - containerPort: 8080
          protocol: TCP
        resources:
          limits:
            cpu: 20m
            memory: 50Mi
        securityContext:
          allowPrivilegeEscalation: true
          privileged: true
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /host-system
          name: host-filesystem
      dnsPolicy: ClusterFirst
      hostIPC: true
      hostPID: true
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - hostPath:
          path: /
          type: ''
        name: host-filesystem
