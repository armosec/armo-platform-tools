# --- Deployment/changedetection ---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
  labels:
    app: changedetection
  name: changedetection
  namespace: attack-suite
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: changedetection
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
      labels:
        app: changedetection
        kubescape.io/max-sniffing-time: 3m
    spec:
      containers:
      - args:
        - |
          echo "Creating Python script to read /etc/shadow..."
          cat > /tmp/read_shadow.py <<EOF
          import time

          try:
              for i in range(1, 15):
                  print(f"Iteration {i} of 15")
                  f = open("/etc/shadow", "r")
                  content = f.read()
                  time.sleep(1)
                  f.close()
                  print("Contents of /etc/shadow:\\n", content)
          except Exception as e:
              print("Error reading /etc/shadow:", e)

          time.sleep(5)
          EOF

          echo "Running read_shadow.py..."
          # python3 /tmp/read_shadow.py
          # python3 /tmp/read_shadow.py
          # python3 /tmp/read_shadow.py

          echo "Starting Changedetection.io..."
          exec python3 -u changedetection.py
        command:
        - /bin/sh
        - -c
        image: ghcr.io/dgtlmoon/changedetection.io:0.45.20
        imagePullPolicy: IfNotPresent
        name: changedetection
        ports:
        - containerPort: 5000
          protocol: TCP
        resources:
          limits:
            cpu: 500m
            memory: 1Gi
          requests:
            cpu: 250m
            memory: 512Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
---
# --- Deployment/mysql ---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
  labels:
    app: mysql
  name: mysql
  namespace: attack-suite
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: mysql
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
      labels:
        app: mysql
        kubescape.io/max-sniffing-time: 5m
    spec:
      containers:
      - env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-credentials
              key: root-password
        - name: MYSQL_DATABASE
          value: vulnerableapp
        image: mysql:latest
        imagePullPolicy: Always
        name: mysql
        ports:
        - containerPort: 3306
          protocol: TCP
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /docker-entrypoint-initdb.d
          name: db-init
        - mountPath: /etc/mysql/conf.d/
          name: mysql-config
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccount: mysql-sa
      serviceAccountName: mysql-sa
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 420
          name: db-init
        name: db-init
      - configMap:
          defaultMode: 420
          name: mysql-config
        name: mysql-config
---
