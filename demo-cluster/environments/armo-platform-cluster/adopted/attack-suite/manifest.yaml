---
# --- Deployment/secure-python-app ---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
  labels:
    app: secure-python-app
  name: secure-python-app
  namespace: attack-suite
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: secure-python-app
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
      labels:
        app: secure-python-app
        kubescape.io/max-sniffing-time: 5m
    spec:
      containers:
      - env:
        - name: MYSQL_HOST
          valueFrom:
            secretKeyRef:
              key: host
              name: db-credentials
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              key: username
              name: db-credentials
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: db-credentials
        - name: MYSQL_DB
          valueFrom:
            secretKeyRef:
              key: database
              name: db-credentials
        image: hisu/secure-python-app:latest
        imagePullPolicy: Always
        name: secure-python-app
        ports:
        - containerPort: 5000
          protocol: TCP
        resources: {}
        securityContext: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /app/templates
          name: templates
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 420
          name: templates
        name: templates
---
# --- Service/changedetection-service ---
apiVersion: v1
kind: Service
metadata:
  annotations:
    cloud.google.com/neg: '{"ingress":true}'
  name: changedetection-service
  namespace: attack-suite
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - port: 5000
    protocol: TCP
    targetPort: 5000
  selector:
    app: changedetection
  sessionAffinity: None
  type: ClusterIP
