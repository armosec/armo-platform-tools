# --- Deployment/cache-store-deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
  labels:
    app: cache-store
  name: cache-store-deployment
  namespace: secure-middleware
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: cache-store
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
      labels:
        app: cache-store
    spec:
      containers:
      - image: madhuakula/k8s-goat-cache-store
        imagePullPolicy: Always
        name: cache-store
        ports:
        - containerPort: 6379
          protocol: TCP
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
---
# --- Service/cache-store-service ---
apiVersion: v1
kind: Service
metadata:
  annotations:
    cloud.google.com/neg: '{"ingress":true}'
  name: cache-store-service
  namespace: secure-middleware
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - port: 6379
    protocol: TCP
    targetPort: 6379
  selector:
    app: cache-store
  sessionAffinity: None
  type: ClusterIP